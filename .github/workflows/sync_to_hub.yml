name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf auth login --token $HF_TOKEN --add-to-git-credential
          hf upload --repo-type dataset Seplenovaedge/Thingsbaord_dtaset_of_company . . \
            --exclude ".git/*" --exclude ".github/*" --exclude ".venv/*" \
            --exclude ".env" --exclude "**/.env" --exclude ".env.*" \
            --exclude "*.jsonl" --exclude "**/*.jsonl" \
            --exclude "*.xlsx" --exclude "**/*.xlsx" \
            --exclude "ts_daily_snapshots_*.csv" --exclude "**/ts_daily_snapshots_*.csv" \
            --exclude "current_state_snapshots/*" --exclude "current_state_snapshots/**" \
            --exclude "dashboard_data*.json" --exclude "**/dashboard_data*.json" \
            --exclude "offline_recoveries.csv" \
            --exclude "harvest_cache/**" --exclude "data_harvest/**" --exclude "training_data/**"
